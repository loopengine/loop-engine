id: crm.lead_qualification
name: Lead qualification
version: 1.0.0
domain: crm
description: >
  Lead qualification from creation through SQL conversion.
  Tracks ICP assessment, outreach, and handoff to sales.

states:
  - id: CREATED
    label: CREATED
  - id: ICP_ASSESSED
    label: ICP ASSESSED
  - id: OUTREACH_SENT
    label: OUTREACH SENT
  - id: MEETING_SCHEDULED
    label: MEETING SCHEDULED
  - id: QUALIFIED
    label: QUALIFIED
    isTerminal: true
  - id: DISQUALIFIED
    label: DISQUALIFIED
    isTerminal: true

initialState: CREATED

transitions:
  - id: assess_icp
    from: CREATED
    to: ICP_ASSESSED
    actors: [human, automation, ai-agent]

  - id: send_outreach
    from: ICP_ASSESSED
    to: OUTREACH_SENT
    actors: [human, automation, ai-agent]

  - id: schedule_meeting
    from: OUTREACH_SENT
    to: MEETING_SCHEDULED
    # webhook is not an engine actor type; an inbound scheduler is automation
    actors: [human, automation]

  - id: qualify
    from: MEETING_SCHEDULED
    to: QUALIFIED
    actors: [human]

  - id: disqualify_from_created
    from: CREATED
    to: DISQUALIFIED
    actors: [human]

  - id: disqualify_from_icp
    from: ICP_ASSESSED
    to: DISQUALIFIED
    actors: [human]

  - id: disqualify_from_outreach
    from: OUTREACH_SENT
    to: DISQUALIFIED
    actors: [human]

  - id: disqualify_from_meeting
    from: MEETING_SCHEDULED
    to: DISQUALIFIED
    actors: [human]

outcome:
  id: lead_qualified
  description: Lead converted to SQL and handed to sales
  valueUnit: lead_qualified
  measurable: true
  businessMetrics:
    - id: qualification_cycle_time
      label: Lead qualification cycle time (days)
      unit: days
      improvableByAI: true
    - id: outreach_to_meeting_rate
      label: Outreach to meeting conversion rate
      unit: percentage
      improvableByAI: true
